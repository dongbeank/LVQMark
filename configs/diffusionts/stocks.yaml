# Diffusion-TS — stocks.
#
# Adapted from https://github.com/soizhiwen/TimeWak
#
# seq_length / window are overridden by --window_size on the command line (24 here,
# 64 for every run this repo records).

model:
  target: Models.interpretable_diffusion.gaussian_diffusion.Diffusion_TS
  params:
    seq_length: 24
    feature_size: 6
    n_layer_enc: 2
    n_layer_dec: 2
    d_model: 64  # 4 X 16
    timesteps: 500
    sampling_timesteps: 250
    loss_type: 'l1'
    beta_schedule: 'cosine'
    n_heads: 4
    mlp_hidden_times: 4
    attn_pd: 0.0
    resid_pd: 0.0
    kernel_size: 1
    padding_size: 0
    bdia_gamma: 0.99

solver:
  base_lr: 1.0e-5
  max_epochs: 10000
  gradient_accumulate_every: 2
  save_cycle: 1000  # max_epochs // 10
  ema:
    decay: 0.995
    update_interval: 10
  
  scheduler:
    target: Models.interpretable_diffusion.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5
      patience: 2000
      min_lr: 1.0e-5
      threshold: 1.0e-1
      threshold_mode: rel
      warmup_lr: 8.0e-4
      warmup: 500 
      verbose: False

dataloader:
  train_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: stock
      proportion: 0.8  # Set to rate < 1 if training conditional generation
      data_root: ./Data/datasets/stock_data.csv
      window: 24  # seq_length
      save2npy: True
      neg_one_to_one: True
      seed: 123
      period: train

  test_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: stock
      proportion: 0.8  # rate
      data_root: ./Data/datasets/stock_data.csv
      window: 24  # seq_length
      save2npy: True
      neg_one_to_one: True
      seed: 123
      period: test

  batch_size: 64
  sample_size: 256
  shuffle: True
